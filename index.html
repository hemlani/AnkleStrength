<html lang="en">
<head>
<meta charset="UTF-8">

<style>
:root{
  --bg:#161d1b; --panel:#1f2926; --panel2:#26322e; --border:#34423d;
  --text:#eaf1ee; --muted:#9fb0aa; --faint:#6f817b;
  --accent:#4fcfa6; --accent-d:#2d6a5a; --accent-ink:#06231b;
  --accent-soft:rgba(79,207,166,.15);
  --warn:#e7b75a; --warn-soft:rgba(231,183,90,.14);
  --danger:#e87a7a; --danger-soft:rgba(232,122,122,.14);
  --tabh:64px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
a{color:var(--accent)}
.topbar{position:sticky;top:0;z-index:20;background:rgba(22,29,27,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;}
.topbar h1{font-size:20px;font-weight:800;letter-spacing:-.3px}
.topbar h1 .dot{color:var(--accent)}
.topbar .sub{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:1.5px;margin-top:1px}
.main{padding:16px 16px calc(var(--tabh) + env(safe-area-inset-bottom) + 24px)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;
  background:rgba(22,29,27,.96);backdrop-filter:blur(10px);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;height:var(--tabh);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;color:var(--faint);font-size:10px;font-weight:600;letter-spacing:.3px}
.tabbar button .ic{font-size:21px;line-height:1}
.tabbar button.on{color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.card.tight{padding:13px 15px}
.btn{display:block;width:100%;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;
  padding:16px;border-radius:14px;text-align:center;letter-spacing:.2px}
.btn:active{transform:scale(.985)}
.btn.lg{padding:19px;font-size:18px}
.btn.sec{background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent-d)}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
.btn.danger{background:var(--danger-soft);color:var(--danger);border:1px solid rgba(232,122,122,.4)}
.btn.sm{padding:11px;font-size:14px;border-radius:11px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.section-label{font-size:11px;text-transform:uppercase;letter-spacing:1.4px;color:var(--faint);
  font-weight:700;margin:20px 2px 9px}
.section-label:first-child{margin-top:4px}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.center{text-align:center}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;
  background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.gray{background:var(--panel2);color:var(--muted)}
/* progress ring */
.ringwrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:104px;height:104px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .rc .big{font-size:28px;font-weight:800;line-height:1}
.ring .rc .sm{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.statgrid{display:flex;gap:10px}
.stat{flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:11px 12px}
.stat .v{font-size:24px;font-weight:800;color:var(--accent)}
.stat .v small{font-size:12px;font-weight:600;color:var(--muted)}
.stat .l{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--faint);margin-top:1px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 4px;min-width:42px;flex:1;text-align:center;border-radius:10px;border:1px solid var(--border);
  background:var(--panel2);color:var(--muted);font-size:13px;font-weight:700}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:11px 0;border-radius:10px;border:1px solid var(--border);background:var(--panel2);
  color:var(--muted);font-weight:700;font-size:14px}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
/* banners */
.banner{border-radius:14px;padding:14px 15px;margin-bottom:14px;display:flex;gap:12px;align-items:flex-start}
.banner .bx{flex:1}
.banner h3{font-size:15px;font-weight:700;margin-bottom:3px}
.banner p{font-size:13px;line-height:1.45}
.banner .em{font-size:22px;line-height:1}
.banner.accent{background:var(--accent-soft);border:1px solid var(--accent-d)}
.banner.warn{background:var(--warn-soft);border:1px solid rgba(231,183,90,.4)}
.banner .x{flex:0 0 auto;color:var(--faint);font-size:20px;font-weight:700;padding:0 2px;line-height:1}
.safety{background:var(--warn-soft);border:1px solid rgba(231,183,90,.35);border-radius:12px;padding:11px 13px;margin-bottom:14px}
.safety .h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--warn);margin-bottom:5px}
.safety ul{margin:0;padding-left:17px}
.safety li{font-size:12.5px;line-height:1.5;color:var(--text);margin-bottom:2px}
/* inputs */
label.f{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 5px 2px}
input.t,textarea.t,select.t{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:11px;
  color:var(--text);font-size:15px;padding:12px 13px;outline:none}
input.t:focus,textarea.t:focus,select.t:focus{border-color:var(--accent-d)}
textarea.t{min-height:64px;resize:vertical;line-height:1.5}
.field{margin-bottom:12px}
.inline2{display:flex;gap:10px}
.inline2>*{flex:1}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.toggle:last-child{border-bottom:none}
.toggle .tt{font-size:14px;font-weight:600}
.toggle .td{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.4}
.sw{flex:0 0 auto;width:50px;height:30px;border-radius:16px;background:var(--panel2);border:1px solid var(--border);position:relative;transition:.18s}
.sw.on{background:var(--accent);border-color:var(--accent)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.18s}
.sw.on::after{left:23px}
/* exercise card */
.ex{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin-bottom:11px}
.ex .eh{display:flex;align-items:center;gap:11px}
.ex .em{font-size:25px;flex:0 0 auto}
.ex .en{font-size:15px;font-weight:700}
.ex .et{font-size:11.5px;color:var(--muted);margin-top:1px}
.ex .ar{color:var(--faint);font-size:15px;transition:.2s;flex:0 0 auto}
.ex .ar.open{transform:rotate(180deg)}
.ex .eb{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.ex .desc{font-size:13.5px;line-height:1.55;color:var(--muted);margin-bottom:10px}
.why{background:var(--accent-soft);border-radius:9px;padding:9px 11px;margin-bottom:10px}
.why .l{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--accent);margin-bottom:2px}
.why .t{font-size:12.5px;color:var(--text);line-height:1.45}
.watch{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--border);
  border-radius:10px;padding:10px 14px;font-size:13px;font-weight:700;color:var(--text)}
.watch .pl{color:var(--accent)}
/* player */
.player{min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 10px) 16px 0}
.ptop{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ptop .close{font-size:15px;font-weight:700;color:var(--muted)}
.ptop .cnt{font-size:12px;color:var(--faint);font-weight:700;letter-spacing:.5px}
.pdots{display:flex;gap:5px;margin-bottom:18px;flex-wrap:wrap}
.pdots i{height:5px;flex:1;min-width:8px;border-radius:3px;background:var(--border)}
.pdots i.cur{background:var(--accent)}
.pdots i.done{background:var(--accent-d)}
.pdots i.skip{background:var(--warn)}
.pbody{flex:1}
.pname{font-size:26px;font-weight:800;letter-spacing:-.4px;line-height:1.1}
.pmeta{font-size:14px;color:var(--accent);font-weight:700;margin-top:6px}
.pemoji{font-size:40px;margin-bottom:8px}
.setbtns{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}
.setb{flex:1;min-width:74px;padding:18px 0;border-radius:13px;border:1px solid var(--border);background:var(--panel2);
  color:var(--muted);font-weight:800;font-size:15px}
.setb.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.extimer{display:flex;align-items:center;justify-content:space-between;background:var(--accent-soft);
  border:1px solid var(--accent-d);border-radius:13px;padding:12px 15px;margin-top:14px}
.extimer .el{font-size:13px;font-weight:700;color:var(--accent)}
.extimer .ev{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--text)}
.extimer.paused{opacity:.7;border-style:dashed}
.rest{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--border);
  border-radius:13px;padding:12px;margin:14px 0}
.rest .lbl{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.5px;margin-right:2px}
.rest .clk{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;min-width:64px;text-align:center;color:var(--accent)}
.rest .rb{padding:9px 12px;border-radius:9px;background:var(--panel2);border:1px solid var(--border);font-weight:800;font-size:14px}
.pnav{display:flex;gap:9px;margin:14px 0}
.pnav button{padding:14px 0;border-radius:12px;background:var(--panel2);border:1px solid var(--border);font-weight:700;font-size:14px}
.pfoot{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);
  padding:12px 0 calc(env(safe-area-inset-bottom) + 14px)}
/* history */
.hcard{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:11px}
.hcard .ht{display:flex;justify-content:space-between;align-items:center}
.hcard .hd{font-size:15px;font-weight:700}
.exrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.extag{font-size:11.5px;padding:4px 9px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.hnote{font-size:12.5px;color:var(--muted);font-style:italic;margin-top:9px;line-height:1.45}
.hdetail{margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted)}
.hdetail .l{color:var(--text);font-weight:600}
/* charts */
.chcard{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px}
canvas.ch{width:100%;height:150px;display:block}
.barlegend{font-size:11px;color:var(--faint);margin-top:6px;text-align:center}
/* onboarding */
.ob{min-height:100%;padding:calc(env(safe-area-inset-top) + 30px) 22px calc(env(safe-area-inset-bottom) + 30px);
  display:flex;flex-direction:column}
.ob h1{font-size:30px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.ob h1 .dot{color:var(--accent)}
.ob .lead{font-size:15px;color:var(--muted);line-height:1.5;margin-bottom:22px}
.ackrow{display:flex;gap:11px;align-items:flex-start;background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:13px;margin:6px 0 4px}
.ackbox{flex:0 0 auto;width:24px;height:24px;border-radius:7px;border:2px solid var(--border);margin-top:1px;
  display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent-ink)}
.ackbox.on{background:var(--accent);border-color:var(--accent)}
.ackrow .at{font-size:13px;line-height:1.5;color:var(--text)}
/* modal */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;width:100%;max-width:520px;overflow:hidden}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal .mh .t{font-weight:700;font-size:15px}
.modal .mh .x{font-size:22px;color:var(--muted);padding:0 4px}
.vidframe{position:relative;width:100%;padding-top:56.25%;background:#000}
.vidframe iframe,.vidframe video{position:absolute;inset:0;width:100%;height:100%;border:0}
/* toast */
#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);
  background:#0c1311;border:1px solid var(--accent-d);color:var(--text);padding:11px 18px;border-radius:11px;
  font-size:13px;font-weight:600;z-index:80;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
.errscreen{padding:40px 22px;color:var(--danger);line-height:1.6}
.empty{text-align:center;padding:46px 20px;color:var(--faint)}
.empty .e{font-size:40px;margin-bottom:12px}
.tiny{font-size:11.5px;color:var(--faint);line-height:1.5}
.editgrid{display:flex;gap:10px;margin-bottom:10px}
.editgrid>div{flex:1}
/* library controls */
.libctl{position:sticky;top:calc(env(safe-area-inset-top) + 60px);z-index:10;background:var(--bg);
  padding:8px 0 8px;margin:-16px 0 0}
.libsearch{position:relative}
.libsearch .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.7;pointer-events:none}
.libsearch input.t{padding-left:38px;padding-right:40px}
.libsearch input.t::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.libsearch .sclear{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:32px;height:32px;
  border-radius:9px;color:var(--muted);font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center}
.libgroup{margin-top:18px}
.libgroup:first-child{margin-top:2px}
</style>
</head>

  try{var v=localStorage.getItem(key);if(v==null)return fallback;return JSON.parse(v);}
  catch(e){console.warn('read fail',key,e);return fallback;}
}
function lsSet(key,val){
  try{localStorage.setItem(key,JSON.stringify(val));saveOk();return true;}
  catch(e){console.warn('write fail',key,e);saveFail();return false;}

function pad(n){return n<10?'0'+n:''+n;}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayKey(){return ymd(new Date());}
function parseYmd(s){var p=(''+s).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function weekStartDate(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());var day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x;}

function fmtShort(dateStr){var d=parseYmd(dateStr);return (d.getMonth()+1)+'/'+d.getDate();}
function esc(s){return (s==null?'':''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function routineById(id){for(var i=0;i<state.routines.length;i++)if(state.routines[i].id===id)return state.routines[i];return state.routines[0];}
function globalEx(exId){
  for(var i=0;i<state.routines.length;i++){var r=state.routines[i];for(var j=0;j<r.exercises.length;j++)if(r.exercises[j].id===exId)return r.exercises[j];}
  return null;
}
function sessionCounts(s){return s&&s.completedExercises&&s.completedExercises.length>0;}
function weeklyCounts(){var m={};state.sessions.forEach(function(s){if(sessionCounts(s)){var k=weekKeyOf(s.date);m[k]=(m[k]||0)+1;}});return m;}
function thisWeekCount(){return weeklyCounts()[weekKeyOf(todayKey())]||0;}
function didTodayCount(){for(var i=0;i<state.sessions.length;i++){if(state.sessions[i].date===todayKey()&&sessionCounts(state.sessions[i]))return true;}return false;}
function lastCountingDate(){var best=null;state.sessions.forEach(function(s){if(sessionCounts(s)){if(!best||s.date>best)best=s.date;}});return best;}
function computeStreak(){
  var counts=weeklyCounts();var goal=state.settings.weeklyGoal;
  function q(k){return (counts[k]||0)>=goal;}
  var thisWeek=weekStartDate(new Date());
  var start=new Date(thisWeek);
  if(!q(ymd(start)))start.setDate(start.getDate()-7);
  var cur=0,w=new Date(start);
  while(q(ymd(w))){cur++;w.setDate(w.getDate()-7);}
  var keys=Object.keys(counts).filter(q).sort();
  var longest=0,run=0,prev=null;
  keys.forEach(function(k){var wd=parseYmd(k);if(prev&&daysBetween(prev,wd)===7)run++;else run=1;if(run>longest)longest=run;prev=wd;});
  if(cur>longest)longest=cur;
  return {current:cur,longest:longest};
}

function ytEmbed(url){
  var m=(''+url).match(/(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([\w\-]{6,})/);
  return m?'https://www.youtube.com/embed/'+m[1]:null;
}
function ring(value,goal,done){
  var size=104,sw=10,r=(size-sw)/2,c=2*Math.PI*r;
  var pct=goal>0?Math.min(1,value/goal):0;var off=c*(1-pct);
  var col=done?'var(--accent)':'var(--accent)';
  return '<div class="ring"><svg width="'+size+'" height="'+size+'">'+
    '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" stroke="var(--border)" stroke-width="'+sw+'" fill="none"/>'+
    '<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" stroke="'+col+'" stroke-width="'+sw+'" fill="none" '+
    'stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" style="transition:stroke-dashoffset .5s"/></svg>'+
    '<div class="rc"><div class="big">'+value+'<span style="color:var(--muted);font-size:18px">/'+goal+'</span></div><div class="sm">this week</div></div></div>';
}

function backupDue(){
  var b=state.backup;
  var counting=state.sessions.filter(sessionCounts).length;
  if(counting===0)return false;
  if((b.sessionsSinceLastBackup||0)>=3)return true;
  if(!b.lastBackupDate)return counting>=3;
  return daysBetween(parseYmd(b.lastBackupDate),new Date())>=7;

function fmtClock(s){var m=Math.floor(s/60);var ss=s%60;return m+':'+(ss<10?'0':'')+ss;}
function fmtDuration(s){if(s<60)return s+'s';var m=Math.round(s/60);if(m<60)return m+' min';var h=Math.floor(m/60);return h+'h '+(m%60)+'m';}
function exElapsed(a){return (a.exAccum||0)+(a.exStart?Math.max(0,Math.floor((Date.now()-a.exStart)/1000)):0);}
function pauseEx(a){if(a.exStart){a.exAccum=(a.exAccum||0)+Math.max(0,Math.floor((Date.now()-a.exStart)/1000));a.exStart=null;}}
function resumeEx(a){if(!a.exStart)a.exStart=Date.now();}
var uiInt=null;
function startUITick(){clearInterval(uiInt);uiInt=setInterval(updateClocks,250);updateClocks();}
function updateClocks(){
  if(state.view!=='player'||!state.active){clearInterval(uiInt);return;}
  var a=state.active;
  var ex=document.getElementById('exClock');
  if(ex)ex.textContent=fmtClock(exElapsed(a));
  var sc=document.getElementById('sessClock');
  if(sc)sc.textContent=fmtClock(Math.max(0,Math.floor((Date.now()-a.startedAt)/1000)));
  var rc=document.getElementById('restClock');
  if(rc&&a.restEnd){
    var rem=Math.ceil((a.restEnd-Date.now())/1000);
    if(rem<=0){a.restEnd=null;resumeEx(a);saveActive();if(navigator.vibrate)navigator.vibrate(180);render();return;}
    rc.textContent=fmtClock(rem);
  }
}
function afterPlayer(){startUITick();requestWake();}

/* keep the screen awake during a workout (Wake Lock API; iOS Safari 16.4+) */
var wakeLock=null;
function requestWake(){
  if(wakeLock||!navigator.wakeLock||!navigator.wakeLock.request)return;
  try{navigator.wakeLock.request('screen').then(function(wl){wakeLock=wl;if(wl.addEventListener)wl.addEventListener('release',function(){wakeLock=null;});}).catch(function(){});}catch(e){}
}
function releaseWake(){if(wakeLock){try{wakeLock.release();}catch(e){}wakeLock=null;}}
if(document.addEventListener)document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'&&state.view==='player'&&state.active)requestWake();
});

/* ============================ PROGRESS ============================ */
function renderProgress(){
  var counting=state.sessions.filter(sessionCounts);
  if(!counting.length)return '<div class="empty"><div class="e">📈</div><div>Complete a session to see progress.</div></div>';
  var st=computeStreak();var twc=thisWeekCount();var goal=state.settings.weeklyGoal;
  var h='<div class="statgrid"><div class="stat"><div class="v">'+counting.length+'</div><div class="l">Total sessions</div></div>'+
    '<div class="stat"><div class="v">'+twc+'<small>/'+goal+'</small></div><div class="l">This week</div></div>'+
    '<div class="stat"><div class="v">'+st.longest+'<small>wk</small></div><div class="l">Best streak</div></div></div>';

  h+='<div class="section-label">Sessions per week</div><div class="chcard"><canvas id="chWeeks" class="ch"></canvas><div class="barlegend">Dashed line = your goal of '+goal+'/week</div></div>';

  // per-exercise trend
  var withWeight=[];
  state.routines.forEach(function(r){r.exercises.forEach(function(ex){
    for(var i=0;i<state.sessions.length;i++){var s=state.sessions[i];if(!sessionCounts(s))continue;for(var j=0;j<s.completedExercises.length;j++){var c=s.completedExercises[j];if(c.exerciseId===ex.id&&parseFloat(c.weight)>0){withWeight.push(ex);return;}}}
  });});
  if(withWeight.length){
    if(!state.trendExId||!withWeight.some(function(e){return e.id===state.trendExId;}))state.trendExId=withWeight[0].id;
    h+='<div class="section-label">Strength trend</div>';
    h+='<select class="t" style="margin-bottom:12px" onchange="A.trend(this.value)">';
    withWeight.forEach(function(ex){h+='<option value="'+ex.id+'"'+(ex.id===state.trendExId?' selected':'')+'>'+esc(ex.name)+'</option>';});
    h+='</select>';
    h+='<div class="chcard"><canvas id="chTrend" class="ch"></canvas><div class="barlegend">Logged weight over time</div></div>';
  }else{
    h+='<div class="section-label">Strength trend</div><div class="card tight"><div class="tiny">Log a weight on an exercise during a workout and your strength trend will appear here.</div></div>';
  }

  // per-exercise completion
  h+='<div class="section-label">How often you do each exercise</div><div class="card">';
  var allEx=[];state.routines.forEach(function(r){r.exercises.forEach(function(e){allEx.push(e);});});
  allEx.forEach(function(ex){
    var n=0;counting.forEach(function(s){if(s.completedExercises.some(function(c){return c.exerciseId===ex.id;}))n++;});
    var rate=Math.round(n/counting.length*100);
    h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px"><span style="font-size:19px">'+ex.em+'</span>'+
      '<div style="flex:1"><div style="font-size:13px;font-weight:600;margin-bottom:4px">'+esc(ex.name)+'</div>'+

      '<span style="font-size:13px;font-weight:700;color:'+(rate>=60?'var(--accent)':'var(--muted)')+'">'+rate+'%</span></div>';
  });
  h+='</div>';
  return h;
}
function afterProgress(){drawWeeksChart();drawTrendChart();}
function drawWeeksChart(){
  var cv=document.getElementById('chWeeks');if(!cv)return;
  var counts=weeklyCounts();var goal=state.settings.weeklyGoal;
  var weeks=[];var w=weekStartDate(new Date());
  for(var i=0;i<10;i++){var k=ymd(w);weeks.unshift({k:k,v:counts[k]||0,l:fmtShort(k)});w.setDate(w.getDate()-7);}
  var ctx=setupCanvas(cv);if(!ctx)return;var W=ctx._w,H=ctx._h;
  var P={t:12,r:10,b:22,l:24};var cw=W-P.l-P.r,ch=H-P.t-P.b;
  var mx=Math.max(goal+1,3);for(var i=0;i<weeks.length;i++)if(weeks[i].v>mx)mx=weeks[i].v;
  ctx.clearRect(0,0,W,H);
  // grid
  ctx.strokeStyle='rgba(255,255,255,.06)';ctx.lineWidth=1;ctx.fillStyle='#6f817b';ctx.font='10px system-ui';ctx.textAlign='right';
  for(var g=0;g<=mx;g++){var y=P.t+ch-ch*g/mx;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(W-P.r,y);ctx.stroke();ctx.fillText(g,P.l-4,y+3);}
  // goal line
  var gy=P.t+ch-ch*goal/mx;ctx.strokeStyle='#4fcfa6';ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(P.l,gy);ctx.lineTo(W-P.r,gy);ctx.stroke();ctx.setLineDash([]);
  // bars
  var bw=cw/weeks.length;ctx.textAlign='center';
  weeks.forEach(function(d,i){
    var x=P.l+bw*i+bw*0.18,bw2=bw*0.64;var bh=ch*d.v/mx;
    ctx.fillStyle=d.v>=goal?'#4fcfa6':'#2d6a5a';
    roundRect(ctx,x,P.t+ch-bh,bw2,bh,4);ctx.fill();
    ctx.fillStyle='#6f817b';ctx.fillText(d.l,P.l+bw*i+bw/2,H-6);
  });
}
function drawTrendChart(){
  var cv=document.getElementById('chTrend');if(!cv||!state.trendExId)return;
  var pts=[];
  state.sessions.slice().sort(function(a,b){return a.date<b.date?-1:1;}).forEach(function(s){
    if(!sessionCounts(s))return;
    s.completedExercises.forEach(function(c){if(c.exerciseId===state.trendExId){var wt=parseFloat(c.weight);if(wt>0)pts.push({l:fmtShort(s.date),v:wt});}});
  });
  var ctx=setupCanvas(cv);if(!ctx)return;var W=ctx._w,H=ctx._h;
  ctx.clearRect(0,0,W,H);if(!pts.length)return;
  var P={t:12,r:12,b:22,l:30},cw=W-P.l-P.r,ch=H-P.t-P.b;
  var mx=pts[0].v,mn=pts[0].v;pts.forEach(function(p){if(p.v>mx)mx=p.v;if(p.v<mn)mn=p.v;});
  if(mn>0)mn=Math.max(0,mn-(mx-mn||1)*0.2);if(mx===mn)mx=mn+1;var rng=mx-mn;
  ctx.strokeStyle='rgba(255,255,255,.06)';ctx.fillStyle='#6f817b';ctx.font='10px system-ui';ctx.textAlign='right';
  for(var i=0;i<=4;i++){var y=P.t+ch-ch*i/4;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(W-P.r,y);ctx.stroke();ctx.fillText(Math.round(mn+rng*i/4),P.l-5,y+3);}
  function X(i){return pts.length>1?P.l+cw*i/(pts.length-1):P.l+cw/2;}
  function Y(v){return P.t+ch-ch*(v-mn)/rng;}
  ctx.strokeStyle='#4fcfa6';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.beginPath();
  pts.forEach(function(p,i){if(i===0)ctx.moveTo(X(i),Y(p.v));else ctx.lineTo(X(i),Y(p.v));});ctx.stroke();
  ctx.fillStyle='#4fcfa6';pts.forEach(function(p,i){ctx.beginPath();ctx.arc(X(i),Y(p.v),3.5,0,7);ctx.fill();});
  ctx.fillStyle='#6f817b';ctx.textAlign='center';var step=Math.max(1,Math.floor(pts.length/6));
  pts.forEach(function(p,i){if(i%step===0||i===pts.length-1)ctx.fillText(p.l,X(i),H-6);});
}
function setupCanvas(cv){
  var ctx=cv.getContext('2d');var dpr=window.devicePixelRatio||1;var rect=cv.getBoundingClientRect();
  if(!rect.width)return null;cv.width=rect.width*dpr;cv.height=rect.height*dpr;ctx.scale(dpr,dpr);ctx._w=rect.width;ctx._h=rect.height;return ctx;
}
function roundRect(ctx,x,y,w,h,r){if(h<r)r=h<0?0:h/2;ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

  if(s.shareEnabled){
    h+='<button class="btn ghost sm" style="margin-top:12px" onclick="A.shareSummary()">Share summary text</button>';
    h+='<button class="btn ghost sm" style="margin-top:9px" onclick="A.shareImage()">Save summary image</button>';
  }
  h+='</div>';

  h+='<div class="section-label">Safety</div>'+safetyStrip();
  h+='<div class="card tight"><div class="tiny">Given the back pain and nausea-with-abdominal-pressure symptom, it’s worth clearing new exercise with a doctor or physical therapist. Start lighter than feels necessary.</div></div>';

  h+='<div class="section-label">Danger zone</div><div class="card">';
  h+='<button class="btn danger" onclick="A.resetData()">Erase all data &amp; start over</button>';
  h+='<div class="tiny" style="margin-top:9px">Removes every session, setting, and edit on this device. Back up first.</div></div>';

  h+='<div class="tiny center" style="margin:6px 0 4px">Show Up · v1 · offline-first · no account, no cloud</div>';
  return h;
}

/* ============================ BACKUP / RESTORE ============================ */
function fullExport(){
  return {app:'show-up',version:1,exportedAt:new Date().toISOString(),
    routines:state.routines,sessions:state.sessions,settings:state.settings,backup:state.backup};
}
function exportData(){
  var data=JSON.stringify(fullExport(),null,2);
  var fname='show-up-backup-'+todayKey()+'.json';
  var blob=new Blob([data],{type:'application/json'});
  function finish(){
    state.backup.lastBackupDate=todayKey();state.backup.sessionsSinceLastBackup=0;saveBackup();
    state.nudgeDismissed=true;
  }
  try{
    if(navigator.canShare){
      var file=new File([blob],fname,{type:'application/json'});
      if(navigator.canShare({files:[file]})){
        navigator.share({files:[file],title:'Show Up backup',text:'My Show Up backup'}).then(function(){finish();toast('Backup shared — save it to Files');render();}).catch(function(){downloadBlob(blob,fname);finish();render();});
        return;
      }
    }
  }catch(e){}
  downloadBlob(blob,fname);finish();toast('Backup downloaded');render();
}
function downloadBlob(blob,fname){
  var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=fname;
  document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(function(){URL.revokeObjectURL(url);},2000);
}
function importData(){
  var inp=document.createElement('input');inp.type='file';inp.accept='application/json,.json';
  inp.onchange=function(){var f=inp.files&&inp.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var d=JSON.parse(rd.result);
        if(!d||(!d.sessions&&!d.routines))throw new Error('Not a Show Up backup');
        if(!confirm('Restore this backup? It will replace the data currently on this device.'))return;
        if(Array.isArray(d.routines)&&d.routines.length){state.routines=d.routines;saveRoutines();}
        if(Array.isArray(d.sessions)){state.sessions=d.sessions;saveSessions();}
        if(d.settings){state.settings=Object.assign(defaultSettings(),d.settings);state.settings.onboarded=true;saveSettings();}
        if(d.backup){state.backup=Object.assign(defaultBackup(),d.backup);saveBackup();}
        state.storageRecovered=false;state.active=lsGet(K.active,null);
        state.libRoutineId=state.routines[0].id;state.startRoutineId=state.routines[0].id;
        state.view='home';toast('Backup restored ✓');render();
      }catch(e){alert('Could not read that file: '+e.message);}
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ============================ REMINDERS (.ics) ============================ */
function downloadICS(){
  var s=state.settings;var days=s.trainingDays.slice().sort();
  if(!days.length){toast('Pick training days first');return;}
  var t=(s.reminderTime||'17:00').split(':');var hh=+t[0],mm=+t[1];
  // first occurrence: next date (incl today) matching a training day
  var d=new Date();d.setHours(hh,mm,0,0);
  for(var add=0;add<8;add++){var cand=new Date();cand.setDate(cand.getDate()+add);cand.setHours(hh,mm,0,0);if(days.indexOf(cand.getDay())>=0&&cand>=new Date()){d=cand;break;}}
  function z(n){return n<10?'0'+n:''+n;}
  function local(dt){return dt.getFullYear()+z(dt.getMonth()+1)+z(dt.getDate())+'T'+z(dt.getHours())+z(dt.getMinutes())+'00';}
  function utc(dt){return dt.getUTCFullYear()+z(dt.getUTCMonth()+1)+z(dt.getUTCDate())+'T'+z(dt.getUTCHours())+z(dt.getUTCMinutes())+z(dt.getUTCSeconds())+'Z';}
  var byday=days.map(function(x){return ['SU','MO','TU','WE','TH','FR','SA'][x];}).join(',');
  var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Show Up//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VEVENT','UID:showup-'+Date.now()+'@showup.local','DTSTAMP:'+utc(new Date()),
    'DTSTART:'+local(d),'DURATION:PT20M','RRULE:FREQ=WEEKLY;BYDAY='+byday,
    'SUMMARY:Show Up — training day','DESCRIPTION:Time to show up. An easy day still counts.',
    'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:Show Up','END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  var blob=new Blob([ics],{type:'text/calendar'});
  var fname='show-up-reminders.ics';
  try{
    if(navigator.canShare){var file=new File([blob],fname,{type:'text/calendar'});if(navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Show Up reminders'}).catch(function(){downloadBlob(blob,fname);});return;}}
  }catch(e){}
  downloadBlob(blob,fname);toast('Open the file to add it to Calendar');
}

/* ============================ SHARE SUMMARY ============================ */
function summaryText(){
  var st=computeStreak();var c=thisWeekCount();var g=state.settings.weeklyGoal;
  return 'Show Up — week of '+fmtNice(weekKeyOf(todayKey()))+'\n'+
    c+'/'+g+' sessions this week\n'+
    'Current streak: '+st.current+' week'+(st.current===1?'':'s')+'\n'+
    'Longest streak: '+st.longest+' weeks\n\nShowing up. 💪';
}
function shareSummary(){
  var txt=summaryText();
  if(navigator.share){navigator.share({title:'Show Up',text:txt}).catch(function(){});}
  else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(function(){toast('Summary copied');});}
  else{alert(txt);}
}
function shareImage(){
  var st=computeStreak();var c=thisWeekCount();var g=state.settings.weeklyGoal;
  var cv=document.createElement('canvas');var s=2;cv.width=600*s;cv.height=400*s;var x=cv.getContext('2d');x.scale(s,s);
  x.fillStyle='#161d1b';x.fillRect(0,0,600,400);
  x.fillStyle='#4fcfa6';x.font='800 40px system-ui';x.fillText('Show Up.',40,70);
  x.fillStyle='#9fb0aa';x.font='600 17px system-ui';x.fillText('Week of '+fmtNice(weekKeyOf(todayKey())),40,100);
  x.fillStyle='#eaf1ee';x.font='800 86px system-ui';x.fillText(c+' / '+g,40,200);
  x.fillStyle='#9fb0aa';x.font='600 18px system-ui';x.fillText('sessions this week',40,232);
  x.fillStyle='#26322e';roundRect(x,40,270,250,90,14);x.fill();
  x.fillStyle='#26322e';roundRect(x,310,270,250,90,14);x.fill();
  x.fillStyle='#4fcfa6';x.font='800 44px system-ui';x.fillText(st.current+'',62,330);x.fillText(st.longest+'',332,330);
  x.fillStyle='#9fb0aa';x.font='600 14px system-ui';x.fillText('CURRENT STREAK (WK)',62,350);x.fillText('LONGEST STREAK (WK)',332,350);
  cv.toBlob(function(blob){
    if(!blob){toast('Could not create image');return;}
    var fname='show-up-week.png';
    try{if(navigator.canShare){var file=new File([blob],fname,{type:'image/png'});if(navigator.canShare({files:[file]})){navigator.share({files:[file],title:'Show Up'}).catch(function(){downloadBlob(blob,fname);});return;}}}catch(e){}
    downloadBlob(blob,fname);toast('Image saved');
  },'image/png');
}

/* ============================ VIDEO MODAL ============================ */
function openVideo(rid,exid){
  var ex=globalEx(exid);if(!ex)return;
  if(!ex.videoUrl){window.open(ytSearchUrl(ex.videoSearchQuery),'_blank','noopener');return;}
  var emb=ytEmbed(ex.videoUrl);
  var inner=emb?'<iframe src="'+esc(emb)+'" allow="accelerometer;autoplay;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe>'
    :'<video src="'+esc(ex.videoUrl)+'" controls playsinline></video>';
  var ov=document.createElement('div');ov.className='overlay';ov.id='vidov';
  ov.innerHTML='<div class="modal"><div class="mh"><div class="t">'+esc(ex.name)+'</div><button class="x" onclick="A.closeVideo()">✕</button></div>'+
    '<div class="vidframe">'+inner+'</div>'+
    '<div style="padding:12px 16px"><button class="btn ghost sm" onclick="window.open(\''+ytSearchUrl(ex.videoSearchQuery).replace(/'/g,"\\'")+'\',\'_blank\')">Search YouTube instead</button></div></div>';
  ov.onclick=function(e){if(e.target===ov)A.closeVideo();};
  document.body.appendChild(ov);
}

/* ============================ ACTIONS ============================ */
var A={
  nav:function(v){state.view=v;state.justLogged=null;window.scrollTo(0,0);render();},
  // onboarding
  obDay:function(d){var i=state.ob.trainingDays.indexOf(d);if(i>=0)state.ob.trainingDays.splice(i,1);else state.ob.trainingDays.push(d);render();},
  obGoal:function(g){state.ob.weeklyGoal=g;render();},
  obTime:function(v){state.ob.reminderTime=v;},
  obAck:function(){state.ob.ack=!state.ob.ack;render();},
  obFinish:function(){if(!state.ob.ack){toast('Please confirm the safety note to continue');return;}
    state.settings.trainingDays=state.ob.trainingDays.slice();
    state.settings.weeklyGoal=state.ob.weeklyGoal;
    state.settings.reminderTime=state.ob.reminderTime;
    state.settings.onboarded=true;saveSettings();state.ob=null;state.view='home';render();},
  // home
  pickStart:function(id){state.startRoutineId=id;render();},
  start:function(mode){if(state.active&&!confirm('You have a workout in progress. Start a new one?'))return;startSession(mode);},
  resume:function(){var a=state.active;if(a&&!a.restEnd)a.exStart=Date.now();state.view='player';render();},
  dismissNudge:function(){state.nudgeDismissed=true;render();},
  dismissReengage:function(){state.reengageDismissed=true;render();},
  dismissReminder:function(){state._reminderDismissed=todayKey();render();},
  dismissInstall:function(){state.settings.installDismissed=true;saveSettings();render();},
  dismissRecovered:function(){state.storageRecovered=false;render();},
  // library
  libRoutine:function(id){state.libRoutineId=id;state.libExpand=null;state.libEdit=null;render();},
  libSearch:function(v){state.libQuery=v;applyLibFilter();},
  libSearchClear:function(){state.libQuery='';var i=document.getElementById('libq');if(i){i.value='';i.focus();}applyLibFilter();},
  libExpand:function(id){state.libExpand=state.libExpand===id?null:id;state.libEdit=null;render();},
  libEditToggle:function(id){state.libEdit=state.libEdit===id?null:id;render();},
  libSave:function(rid,exid){
    var r=routineById(rid);var ex=null;for(var i=0;i<r.exercises.length;i++)if(r.exercises[i].id===exid)ex=r.exercises[i];
    if(!ex)return;
    var sets=parseInt(document.getElementById('ed-sets-'+exid).value,10);
    ex.sets=(sets>=1&&sets<=9)?sets:ex.sets;
    ex.reps=document.getElementById('ed-reps-'+exid).value||ex.reps;
    ex.weight=document.getElementById('ed-wt-'+exid).value;
    ex.videoUrl=document.getElementById('ed-vid-'+exid).value.trim()||null;
    ex.notes=document.getElementById('ed-note-'+exid).value;
    saveRoutines();state.libEdit=null;toast('Saved');render();
  },
  watch:function(rid,exid){openVideo(rid,exid);},
  closeVideo:function(){var ov=document.getElementById('vidov');if(ov)ov.remove();},
  // player
  toggleSet:function(i){var a=state.active;var exId=a.order[a.idx];var pe=a.perEx[exId];if(!pe.sets)pe.sets=[];
    var turningOn=!pe.sets[i];pe.sets[i]=!pe.sets[i];pe.skipped=false;
    if(turningOn&&state.settings.autoRest&&!a.restEnd){var ex=globalEx(exId);if(ex&&!ex.isWarmup&&!ex.isCooldown){pauseEx(a);a.restEnd=Date.now()+state.settings.restDefault*1000;}}
    saveActive();render();},
  exToggle:function(){var a=state.active;if(a.restEnd)return;if(a.exStart)pauseEx(a);else resumeEx(a);saveActive();render();},
  exField:function(f,v){var pe=state.active.perEx[state.active.order[state.active.idx]];pe[f]=v;saveActive();},
  sessNote:function(v){state.active.notes=v;saveActive();},
  next:function(){if(state.active.idx<state.active.order.length-1){state.active.idx++;state.active.exStart=Date.now();state.active.exAccum=0;state.active.restEnd=null;saveActive();window.scrollTo(0,0);render();}},
  prev:function(){if(state.active.idx>0){state.active.idx--;state.active.exStart=Date.now();state.active.exAccum=0;state.active.restEnd=null;saveActive();window.scrollTo(0,0);render();}},
  skip:function(){var a=state.active;a.perEx[a.order[a.idx]].skipped=true;if(a.idx<a.order.length-1){a.idx++;a.exStart=Date.now();a.exAccum=0;a.restEnd=null;}saveActive();window.scrollTo(0,0);render();},
  swap:function(){var a=state.active;if(a.order.length<2)return;var id=a.order.splice(a.idx,1)[0];a.order.push(id);if(a.idx>=a.order.length)a.idx=a.order.length-1;a.exStart=Date.now();a.exAccum=0;a.restEnd=null;saveActive();render();},
  restStart:function(){pauseEx(state.active);state.active.restEnd=Date.now()+state.settings.restDefault*1000;saveActive();render();},
  restStop:function(){state.active.restEnd=null;resumeEx(state.active);saveActive();render();},
  rest:function(delta){var a=state.active;if(a.restEnd){a.restEnd+=delta*1000;if(a.restEnd<Date.now()){a.restEnd=null;resumeEx(a);}}else{state.settings.restDefault=Math.max(15,state.settings.restDefault+delta);saveSettings();}saveActive();render();},
  playerExit:function(){clearInterval(uiInt);releaseWake();state.view='home';render();},
  endLog:function(){
    var a=state.active;if(!a)return;
    var completed=[];
    a.order.forEach(function(id){var pe=a.perEx[id]||{};var sd=(pe.sets||[]).filter(Boolean).length;if(sd>0)completed.push({exerciseId:id,setsDone:sd,weight:pe.weight||'',reps:pe.reps||'',notes:pe.notes||''});});
    if(completed.length===0&&!confirm('Nothing is checked off yet, so this won’t count toward your streak. Log it anyway?'))return;
    var ended=Date.now();
    var session={id:'s'+Date.now(),date:a.date||todayKey(),routineId:a.routineId,startedAt:a.startedAt,endedAt:ended,durationSec:Math.max(0,Math.round((ended-a.startedAt)/1000)),completedExercises:completed,wasEasyDay:a.mode==='easy',notes:a.notes||''};
    state.sessions.push(session);saveSessions();
    if(completed.length>0){state.backup.sessionsSinceLastBackup=(state.backup.sessionsSinceLastBackup||0)+1;saveBackup();}
    clearInterval(uiInt);releaseWake();state.active=null;localStorage.removeItem(K.active);
    state.view='home';state.justLogged=session.id;state.reengageDismissed=true;window.scrollTo(0,0);render();
    setTimeout(function(){toast(completed.length>0?'Logged — nice work showing up 👏':'Session logged');},60);
  },
  // history
  histToggle:function(id){state.histExpand[id]=!state.histExpand[id];render();},
  histDelete:function(id){if(!confirm('Delete this session permanently?'))return;state.sessions=state.sessions.filter(function(s){return s.id!==id;});saveSessions();toast('Session deleted');render();},
  // progress
  trend:function(id){state.trendExId=id;render();},
  // settings
  setDay:function(d){var i=state.settings.trainingDays.indexOf(d);if(i>=0)state.settings.trainingDays.splice(i,1);else state.settings.trainingDays.push(d);saveSettings();render();},
  setGoal:function(g){state.settings.weeklyGoal=g;saveSettings();render();},
  setRest:function(r){state.settings.restDefault=r;saveSettings();render();},
  toggleAutoRest:function(){state.settings.autoRest=!state.settings.autoRest;saveSettings();render();},
  setTime:function(v){state.settings.reminderTime=v;saveSettings();},
  toggleNotif:function(){
    var s=state.settings;
    if(!s.notificationsEnabled){
      if('Notification'in window&&Notification.permission!=='granted'){Notification.requestPermission().then(function(){});}
      s.notificationsEnabled=true;
    }else s.notificationsEnabled=false;
    saveSettings();render();
  },
  toggleShare:function(){state.settings.shareEnabled=!state.settings.shareEnabled;saveSettings();render();},
  exportData:exportData,
  importData:importData,
  downloadICS:downloadICS,
  shareSummary:shareSummary,
  shareImage:shareImage,
  resetData:function(){
    if(!confirm('Erase ALL data on this device and start over? Make sure you have a backup.'))return;
    if(!confirm('Really erase everything? This cannot be undone.'))return;
    try{localStorage.removeItem(K.routines);localStorage.removeItem(K.sessions);localStorage.removeItem(K.settings);localStorage.removeItem(K.backup);localStorage.removeItem(K.active);}catch(e){}
    state.routines=defaultRoutines();state.sessions=[];state.settings=defaultSettings();state.backup=defaultBackup();state.active=null;
    saveRoutines();saveSessions();saveSettings();saveBackup();
    state.view='home';render();
  }
};
window.A=A;

/* ============================ RENDER ============================ */
function render(){
  var app=document.getElementById('app');
  if(!state.settings.onboarded){app.innerHTML=renderOnboard();return;}
  if(state.view==='player'&&state.active){app.innerHTML=renderPlayer();afterPlayer();return;}
  if(state.view==='player')state.view='home';
  clearInterval(uiInt);releaseWake();
  var html=renderTopbar()+'<div class="main">';
  switch(state.view){
    case 'library':html+=renderLibrary();break;
    case 'history':html+=renderHistory();break;
    case 'progress':html+=renderProgress();break;
    case 'settings':html+=renderSettings();break;
    default:html+=renderHome();
  }
  html+='</div>'+renderTabbar();
  app.innerHTML=html;
  if(state.view==='library')applyLibFilter();
  if(state.view==='progress')afterProgress();
  // fire one in-app notification if due
  maybeNotify();
}
function maybeNotify(){
  var s=state.settings;
  if(!s.notificationsEnabled)return;
  if(!('Notification'in window)||Notification.permission!=='granted')return;
  if(!reminderDueNow())return;
  if(s.lastReminderShown===todayKey())return;
  s.lastReminderShown=todayKey();saveSettings();
  try{new Notification('Show Up — training day',{body:'Even an easy day counts. Want to get moving?',icon:'icon-192.png'});}catch(e){}
}
function showInstallHint(){
  if(state.settings.installDismissed)return false;
  var standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  if(standalone)return false;
  return /iphone|ipad|ipod/i.test(navigator.userAgent);
}

/* ============================ SERVICE WORKER ============================ */
function registerSW(){
  if(!('serviceWorker'in navigator))return;
  navigator.serviceWorker.register('sw.js').then(function(reg){
    // re-cache the shell on every launch (don't assume cache survived)
    if(navigator.serviceWorker.controller)navigator.serviceWorker.controller.postMessage('recache');
    reg.addEventListener&&reg.addEventListener('updatefound',function(){});
  }).catch(function(e){console.warn('SW reg failed',e);});
  navigator.serviceWorker.ready.then(function(reg){if(reg.active)reg.active.postMessage('recache');}).catch(function(){});
}

/* ============================ BOOT ============================ */
try{
  load();
  render();
  registerSW();
}catch(e){
  document.getElementById('app').innerHTML='<div class="errscreen"><h2>Couldn’t start cleanly</h2><p>'+esc(e.message)+'</p>'+
    '<p style="margin-top:14px"><button class="btn sec" onclick="A.importData()">Restore from backup</button></p>'+
    '<p style="margin-top:10px"><button class="btn ghost" onclick="location.reload()">Reload</button></p></div>';
}

})();
</script>
