<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ankle Str">
<title>Ankle Strength Tracker</title>
<style>
  :root {
    --bg: #f5f3ef; --white: #fff; --border: #e6e1d9; --border-lt: #eeebe5;
    --accent: #2d6a5a; --accent-lt: #e5f2ed; --accent-bd: #b8ddd0; --accent-mid: #4a9a85;
    --text: #2c2c2c; --text-mid: #5a5a5a; --text-lt: #999;
    --done-bg: #e5f2ed; --done-bd: #b8ddd0; --done-tx: #2d6a5a;
    --tip-bg: #fdf8f0; --tip-bd: #f0e6d4; --tip-label: #b8863e; --tip-tx: #7a6a52;
    --warn-y: #c4952e; --warn-y-bg: #fdf6e8; --warn-r: #c45050; --warn-r-bg: #fdf0f0;
    --input-bg: #faf8f6;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0) 0}
  .header{background:var(--white);border-bottom:1px solid var(--border);padding:20px 20px 16px}
  .header h1{font-size:24px;font-weight:700;color:var(--accent);margin:0 0 2px}
  .header .sub{font-size:12px;color:var(--text-lt);letter-spacing:1.5px;text-transform:uppercase}
  .stats-row{display:flex;gap:12px;margin-top:16px}
  .stat-box{flex:1;background:var(--accent-lt);border-radius:12px;padding:10px 12px;border:1px solid var(--accent-bd)}
  .stat-label{font-size:10px;color:var(--text-lt);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
  .stat-val{font-size:26px;font-weight:700;color:var(--accent)}
  .stat-val span{font-size:13px;font-weight:400}
  .progress-track{height:4px;background:var(--border);border-radius:2px;margin-top:6px;overflow:hidden}
  .progress-fill{height:100%;border-radius:2px;transition:width .4s;background:linear-gradient(90deg,var(--accent-mid),var(--accent))}
  .progress-fill.done{background:var(--accent)}
  .save-status{font-size:11px;padding:4px 10px;border-radius:6px;display:inline-block;margin-top:10px}
  .save-status.ok{background:var(--done-bg);color:var(--done-tx)}
  .save-status.err{background:var(--warn-r-bg);color:var(--warn-r)}
  .tabs{display:flex;padding:12px 20px 0;gap:6px}
  .tab{flex:1;padding:9px 0;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text-lt);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;text-transform:uppercase;letter-spacing:1px}
  .tab.active{background:var(--accent-lt);border-color:var(--accent-bd);color:var(--accent)}
  .content{padding:14px 20px 100px}
  .card{background:var(--white);border:1px solid var(--border-lt);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
  .card.done{background:var(--done-bg);border-color:var(--done-bd);box-shadow:none}
  .card-head{display:flex;align-items:center;gap:10px;cursor:pointer}
  .card-emoji{font-size:26px}
  .card-name{font-size:15px;font-weight:600;color:var(--text)}
  .card.done .card-name{color:var(--done-tx);text-decoration:line-through;opacity:.6}
  .card-meta{font-size:11px;color:var(--text-mid);margin-top:1px}
  .card-arrow{font-size:16px;color:var(--text-lt);transition:transform .2s}
  .card-arrow.open{transform:rotate(180deg)}
  .card-body{margin-top:12px;padding-top:12px;border-top:1px solid var(--border-lt)}
  .card-instr{font-size:13px;line-height:1.55;color:var(--text-mid);margin-bottom:10px}
  .tip-box{background:var(--tip-bg);border:1px solid var(--tip-bd);border-radius:8px;padding:8px 10px;margin-bottom:8px}
  .tip-label{font-size:10px;color:var(--tip-label);text-transform:uppercase;letter-spacing:1px;font-weight:700}
  .tip-text{font-size:12px;color:var(--tip-tx)}
  .card-detail{font-size:12px;color:var(--text-mid);margin-bottom:3px}
  .card-detail strong{color:var(--text)}
  .set-row{display:flex;gap:8px;margin-top:12px}
  .set-btn{flex:1;padding:10px 0;border-radius:10px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid var(--border);background:var(--input-bg);color:var(--text-lt)}
  .set-btn.done{background:var(--accent);border-color:var(--accent);color:#fff}
  .set-btn:active{transform:scale(.96)}
  .pain-row{display:flex;gap:5px}
  .pain-btn{flex:1;padding:9px 0;border-radius:8px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid var(--border);background:var(--input-bg);color:var(--text-lt)}
  .pain-btn.s0,.pain-btn.s1{background:var(--accent-lt);border-color:var(--accent-bd);color:var(--accent)}
  .pain-btn.s2,.pain-btn.s3{background:var(--warn-y-bg);border-color:#e8d6a8;color:var(--warn-y)}
  .pain-btn.s4,.pain-btn.s5{background:var(--warn-r-bg);border-color:#e8b0b0;color:var(--warn-r)}
  .pain-btn:active{transform:scale(.95)}
  .pain-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--text-lt);margin-top:4px;padding:0 2px}
  textarea{width:100%;min-height:60px;background:var(--input-bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:13px;font-family:inherit;padding:10px 12px;resize:vertical;outline:none}
  textarea:focus{border-color:var(--accent-bd)}
  .complete-banner{text-align:center;padding:18px;background:var(--done-bg);border-radius:14px;border:1px solid var(--done-bd)}
  .hist-card{background:var(--white);border:1px solid var(--border-lt);border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .hist-top{display:flex;justify-content:space-between;align-items:center}
  .hist-date{font-size:14px;font-weight:600}
  .hist-score{font-size:14px;font-weight:700}
  .hist-score.full{color:var(--accent)}
  .hist-score.partial{color:var(--text-mid)}
  .pain-badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;margin-left:8px}
  .pain-badge.low{color:var(--accent);background:var(--accent-lt)}
  .pain-badge.med{color:var(--warn-y);background:var(--warn-y-bg)}
  .pain-badge.high{color:var(--warn-r);background:var(--warn-r-bg)}
  .hist-bar{height:3px;background:var(--border);border-radius:2px;margin-top:8px;overflow:hidden}
  .hist-bar-fill{height:100%;border-radius:2px;background:var(--accent-mid)}
  .hist-bar-fill.full{background:var(--accent)}
  .hist-note{font-size:12px;color:var(--text-mid);font-style:italic;margin-top:6px}
  .hist-exercises{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px}
  .hist-ex{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--accent-lt);color:var(--accent);font-weight:500}
  .hist-ex.missed{background:#f5f0ea;color:var(--text-lt);text-decoration:line-through}
  .empty{text-align:center;padding:40px 20px;color:var(--text-lt)}
  .chart-card{background:var(--white);border:1px solid var(--border-lt);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
  .chart-canvas{width:100%;height:140px}
  .section-label{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-lt);font-weight:600;margin:16px 0 8px;padding-left:2px}
  .date-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;background:var(--white);border:1px solid var(--border-lt);border-radius:12px;padding:10px 14px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
  .date-row label{font-size:13px;font-weight:600;white-space:nowrap}
  .date-input{flex:1;font-size:14px;font-family:inherit;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--input-bg);color:var(--text);outline:none;-webkit-appearance:none}
  .date-today-btn{padding:8px 12px;border-radius:8px;border:1px solid var(--accent-bd);background:var(--accent-lt);color:var(--accent);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap}
  .date-past-note{font-size:11px;color:var(--warn-y);background:var(--warn-y-bg);padding:4px 10px;border-radius:6px;margin-bottom:10px;display:inline-block}
  .round-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;background:var(--white);border:1px solid var(--border-lt);border-radius:12px;padding:10px 14px;box-shadow:0 1px 3px rgba(0,0,0,.03)}
  .round-label{font-size:13px;font-weight:600;white-space:nowrap}
  .round-tabs{display:flex;gap:4px;flex:1}
  .round-tab{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--input-bg);color:var(--text-lt);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer}
  .round-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .round-add{padding:6px 10px;border-radius:8px;border:1px dashed var(--accent-bd);background:transparent;color:var(--accent);font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#2d6a5a">
    <p>Loading...</p>
  </div>
</div>
<script>
(function(){
"use strict";
try{

// ===== DB =====
var DB=“AnkleStrengthDB”,VER=2,ST=“workouts”;
function openDB(){
return new Promise(function(ok,no){
var r=indexedDB.open(DB,VER);
r.onupgradeneeded=function(e){var d=e.target.result;if(!d.objectStoreNames.contains(ST))d.createObjectStore(ST,{keyPath:“date”})};
r.onsuccess=function(){ok(r.result)};
r.onerror=function(){no(r.error)};
});
}
function saveDay(date,data){
return openDB().then(function(db){
return new Promise(function(ok,no){
var tx=db.transaction(ST,“readwrite”);
tx.objectStore(ST).put(Object.assign({date:date},data));
tx.oncomplete=function(){ok(true)};
tx.onerror=function(){no(tx.error)};
});
});
}
function loadAllDays(){
return openDB().then(function(db){
return new Promise(function(ok,no){
var tx=db.transaction(ST,“readonly”);
var r=tx.objectStore(ST).getAll();
r.onsuccess=function(){ok(r.result||[])};
r.onerror=function(){no(r.error)};
});
});
}

// ===== Exercises =====
var EX=[
{id:“calf-raises”,name:“Calf Raises”,emoji:”\u{1F9B5}”,sets:2,reps:“12-15”,rest:“30s”,
inst:“Stand flat on the ground. Rise up onto your toes as high as you can. Hold 1 second at the top. Slowly lower back down.”,
tip:“Keep your core tight and don’t rush the lowering phase.”,prog:“Move to a stair edge so your heel drops below the step.”,muscles:“Calves”},
{id:“tibialis-raises”,name:“Tibialis Raises”,emoji:”\u{1F9BF}”,sets:2,reps:“15-20”,rest:“30s”,
inst:“Lean your back flat against a wall. Feet about 12 inches out. Lift your toes up toward your shins, then lower slowly.”,
tip:“Feel the burn in the front of your shins. That’s the target.”,prog:“Add a light dumbbell on top of your foot.”,muscles:“Front of shin”},
{id:“ankle-alphabet”,name:“Ankle Alphabet”,emoji:”\u{1F524}”,sets:1,reps:“A-Z each foot”,rest:”\u2014”,
inst:“Sit in a chair. Lift one foot. Trace each letter of the alphabet in the air using your big toe. Switch feet.”,
tip:“Make the letters big and deliberate.”,prog:“Add an ankle weight.”,muscles:“Ankle stabilizers”},
{id:“single-leg-balance”,name:“Single Leg Balance”,emoji:”\u{1F9D8}”,sets:2,reps:“30-60s / leg”,rest:“15s”,
inst:“Stand on one foot. Eyes forward, core engaged. Hold up to 60 seconds. Switch legs.”,
tip:“Too easy? Close your eyes or stand on a folded towel.”,prog:“Try on a pillow.”,muscles:“Proprioceptors”},
{id:“heel-walks”,name:“Heel Walks”,emoji:”\u{1F6B6}”,sets:2,reps:“30 steps”,rest:“20s”,
inst:“Walk forward on just your heels with toes lifted. Short, controlled steps.”,
tip:“Arms out to the side for balance.”,prog:“Increase to 50 steps.”,muscles:“Dorsiflexors”},
{id:“toe-spreads”,name:“Toe Spreads & Curls”,emoji:”\u{1F9B6}”,sets:2,reps:“15 / foot”,rest:“20s”,
inst:“Barefoot: spread all five toes apart wide, hold 2 sec. Curl them under like gripping the floor, hold 2 sec. That’s one rep.”,
tip:“Most people can barely spread their toes at first. It improves fast.”,prog:“Do them standing on one leg.”,muscles:“Foot muscles”}
];
var TSETS=0;for(var i=0;i<EX.length;i++)TSETS+=EX[i].sets;

function todayKey(){var d=new Date();return d.getFullYear()+”-”+z(d.getMonth()+1)+”-”+z(d.getDate())}
function z(n){return n<10?“0”+n:””+n}
function fmtDate(s){var d=new Date(s+“T12:00:00”);var days=[“Sun”,“Mon”,“Tue”,“Wed”,“Thu”,“Fri”,“Sat”];var mos=[“Jan”,“Feb”,“Mar”,“Apr”,“May”,“Jun”,“Jul”,“Aug”,“Sep”,“Oct”,“Nov”,“Dec”];return days[d.getDay()]+”, “+mos[d.getMonth()]+” “+d.getDate()}
function shortDate(s){var d=new Date(s+“T12:00:00”);return(d.getMonth()+1)+”/”+d.getDate()}

// ===== State =====
var S={
tab:“workout”,selDate:todayKey(),curRound:1,
dayData:{rounds:{“1”:{completed:{},painLevel:-1,notes:””}}},
allDays:[],expanded:null,saveStatus:“loading”,loaded:false
};

function emptyRound(){return{completed:{},painLevel:-1,notes:””}}
function emptyDay(){return{rounds:{“1”:emptyRound()}}}
function curRd(){if(!S.dayData)return emptyRound();return S.dayData.rounds[S.curRound]||emptyRound()}
function rdCount(){return S.dayData?Object.keys(S.dayData.rounds).length:1}
function totalSetsDay(rec){if(!rec||!rec.rounds)return 0;var t=0;var ks=Object.keys(rec.rounds);for(var i=0;i<ks.length;i++)t+=Object.keys(rec.rounds[ks[i]].completed||{}).length;return t}

// ===== Init =====
function init(){
loadAllDays().then(function(all){
S.allDays=all.sort(function(a,b){return b.date<a.date?-1:b.date>a.date?1:0});
loadSelDay();
S.saveStatus=“saved”;
S.loaded=true;
render();
}).catch(function(e){
console.error(“Init error:”,e);
S.saveStatus=“error”;
S.loaded=true;
render();
});
}

function loadSelDay(){
var rec=null;
for(var i=0;i<S.allDays.length;i++){if(S.allDays[i].date===S.selDate){rec=S.allDays[i];break;}}
if(rec&&rec.rounds){
S.dayData={rounds:rec.rounds};
}else if(rec&&rec.completed){
S.dayData={rounds:{“1”:{completed:rec.completed,painLevel:rec.painLevel!=null?rec.painLevel:-1,notes:rec.notes||””}}};
}else{
S.dayData=emptyDay();
}
if(!S.dayData.rounds[S.curRound])S.curRound=1;
}

var saveTimer=null;
function persistDay(){
S.saveStatus=“saving”;
updateStatus();
saveDay(S.selDate,S.dayData).then(function(){
return loadAllDays();
}).then(function(all){
S.allDays=all.sort(function(a,b){return b.date<a.date?-1:b.date>a.date?1:0});
S.saveStatus=“saved”;
updateStatus();
}).catch(function(e){
console.error(“Save error:”,e);
S.saveStatus=“error”;
updateStatus();
});
}

function updateStatus(){
var el=document.getElementById(“save-ind”);
if(el){
el.textContent=S.saveStatus===“saved”?”\u2713 Saved”:S.saveStatus===“saving”?“Saving…”:”\u26A0 Error”;
el.className=“save-status “+(S.saveStatus===“error”?“err”:“ok”);
}
}

// ===== Actions =====
window.doToggleSet=function(exId,si){
var rd=curRd();var k=exId+”-s”+si;var c={};var ks=Object.keys(rd.completed);
for(var i=0;i<ks.length;i++)c[ks[i]]=rd.completed[ks[i]];
if(c[k])delete c[k];else c[k]=Date.now();
rd.completed=c;
S.dayData.rounds[S.curRound]=rd;
persistDay();render();
};
window.doSetPain=function(lv){
var rd=curRd();rd.painLevel=lv;
S.dayData.rounds[S.curRound]=rd;
persistDay();render();
};
window.doSetNotes=function(el){
var rd=curRd();rd.notes=el.value;
S.dayData.rounds[S.curRound]=rd;
clearTimeout(saveTimer);saveTimer=setTimeout(function(){persistDay()},800);
};
window.doAddRound=function(){
var n=rdCount()+1;
S.dayData.rounds[””+n]=emptyRound();
S.curRound=n;
persistDay();render();
};
window.doSwitchRound=function(r){S.curRound=r;render()};
window.doChangeDate=function(el){
S.selDate=el.value;S.curRound=1;
loadSelDay();render();
};
window.doGoToday=function(){
S.selDate=todayKey();S.curRound=1;
loadSelDay();render();
};
window.doSwitchTab=function(t){S.tab=t;render()};
window.doToggleEx=function(id){S.expanded=S.expanded===id?null:id;render()};

function isSetDone(exId,si){return!!curRd().completed[exId+”-s”+si]}
function rdDone(){return Object.keys(curRd().completed).length}
function rdPct(){return TSETS?Math.round(rdDone()/TSETS*100):0}

function getStreak(){
var count=0,d=new Date(),tk=todayKey();
for(;;){
var k=d.getFullYear()+”-”+z(d.getMonth()+1)+”-”+z(d.getDate());
var rec=null;for(var i=0;i<S.allDays.length;i++){if(S.allDays[i].date===k){rec=S.allDays[i];break;}}
var has=rec?totalSetsDay(rec)>0:false;
if(has){count++;d.setDate(d.getDate()-1)}
else if(k===tk){d.setDate(d.getDate()-1)}
else break;
}
return count;
}

function getAvgPain(rec){
if(!rec)return-1;
if(rec.rounds){var s=0,c=0;var ks=Object.keys(rec.rounds);for(var i=0;i<ks.length;i++){var r=rec.rounds[ks[i]];if(r.painLevel!=null&&r.painLevel>=0){s+=r.painLevel;c++}}return c>0?Math.round(s/c*10)/10:-1}
return rec.painLevel!=null?rec.painLevel:-1;
}

function getBestPct(rec){
if(!rec)return 0;
if(rec.rounds){var best=0;var ks=Object.keys(rec.rounds);for(var i=0;i<ks.length;i++){var done=Object.keys(rec.rounds[ks[i]].completed||{}).length;var p=TSETS?Math.round(done/TSETS*100):0;if(p>best)best=p}return best}
if(rec.completed)return TSETS?Math.round(Object.keys(rec.completed).length/TSETS*100):0;
return 0;
}

function esc(s){return s?s.replace(/&/g,”&”).replace(/</g,”<”).replace(/>/g,”>”).replace(/”/g,”"”):””}

// ===== Chart =====
function drawChart(cid,data,color){
setTimeout(function(){
var cv=document.getElementById(cid);if(!cv||!data.length)return;
var ctx=cv.getContext(“2d”);var dpr=window.devicePixelRatio||1;
var rect=cv.getBoundingClientRect();cv.width=rect.width*dpr;cv.height=rect.height*dpr;
ctx.scale(dpr,dpr);var W=rect.width,H=rect.height;
var p={t:10,r:10,b:24,l:30},cw=W-p.l-p.r,ch=H-p.t-p.b;
var vals=[];for(var i=0;i<data.length;i++)vals.push(data[i].v);
var mx=Math.max.apply(null,vals.concat([1])),mn=Math.min.apply(null,vals.concat([0])),rng=mx-mn||1;
ctx.clearRect(0,0,W,H);ctx.strokeStyle=”#eee”;ctx.lineWidth=.5;
for(var i=0;i<=4;i++){var y=p.t+ch-ch*i/4;ctx.beginPath();ctx.moveTo(p.l,y);ctx.lineTo(W-p.r,y);ctx.stroke()}
ctx.fillStyle=”#aaa”;ctx.font=“10px system-ui,sans-serif”;ctx.textAlign=“right”;
for(var i=0;i<=4;i++){var y=p.t+ch-ch*i/4;ctx.fillText(Math.round(mn+rng*i/4),p.l-5,y+3)}
ctx.textAlign=“center”;var step=Math.max(1,Math.floor(data.length/6));
for(var i=0;i<data.length;i++){if(i%step===0||i===data.length-1){var x=p.l+cw*i/(data.length-1||1);ctx.fillText(data[i].l,x,H-4)}}
if(data.length<2){var x2=p.l+cw/2,y2=p.t+ch-ch*(vals[0]-mn)/rng;ctx.fillStyle=color;ctx.beginPath();ctx.arc(x2,y2,4,0,Math.PI*2);ctx.fill();return}
ctx.strokeStyle=color;ctx.lineWidth=2;ctx.lineJoin=“round”;ctx.beginPath();
for(var i=0;i<data.length;i++){var x=p.l+cw*i/(data.length-1),y=p.t+ch-ch*(data[i].v-mn)/rng;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();
var g=ctx.createLinearGradient(0,p.t,0,p.t+ch);g.addColorStop(0,color+“30”);g.addColorStop(1,color+“05”);
ctx.fillStyle=g;ctx.beginPath();
for(var i=0;i<data.length;i++){var x=p.l+cw*i/(data.length-1),y=p.t+ch-ch*(data[i].v-mn)/rng;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}
ctx.lineTo(p.l+cw,p.t+ch);ctx.lineTo(p.l,p.t+ch);ctx.closePath();ctx.fill();
ctx.fillStyle=color;
for(var i=0;i<data.length;i++){var x=p.l+cw*i/(data.length-1),y=p.t+ch-ch*(data[i].v-mn)/rng;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill()}
},50);
}
