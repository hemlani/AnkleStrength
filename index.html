(function(){

// ===== Storage: try IndexedDB, fall back to localStorage =====
var useLS=false;
var DB_NAME=“AnkleDB3”;
var DB_STORE=“w”;
var LS_KEY=“ankle_data”;

function idbOpen(){
return new Promise(function(ok,no){
if(!window.indexedDB){no(new Error(“No IndexedDB”));return;}
var r=indexedDB.open(DB_NAME,1);
r.onupgradeneeded=function(e){
var db=e.target.result;
if(!db.objectStoreNames.contains(DB_STORE)){
db.createObjectStore(DB_STORE,{keyPath:“date”});
}
};
r.onsuccess=function(){ok(r.result)};
r.onerror=function(){no(r.error||new Error(“IDB open failed”))};
});
}

function idbSave(date,data){
return idbOpen().then(function(db){
return new Promise(function(ok,no){
var tx=db.transaction(DB_STORE,“readwrite”);
var obj={date:date};
var keys=Object.keys(data);
for(var i=0;i<keys.length;i++) obj[keys[i]]=data[keys[i]];
tx.objectStore(DB_STORE).put(obj);
tx.oncomplete=function(){ok(true)};
tx.onerror=function(){no(tx.error)};
});
});
}

function idbLoadAll(){
return idbOpen().then(function(db){
return new Promise(function(ok,no){
var tx=db.transaction(DB_STORE,“readonly”);
var r=tx.objectStore(DB_STORE).getAll();
r.onsuccess=function(){ok(r.result||[])};
r.onerror=function(){no(r.error)};
});
});
}

// localStorage fallback
function lsSave(date,data){
try{
var all=JSON.parse(localStorage.getItem(LS_KEY)||”{}”);
all[date]=data;
localStorage.setItem(LS_KEY,JSON.stringify(all));
return Promise.resolve(true);
}catch(e){return Promise.reject(e)}
}

function lsLoadAll(){
try{
var all=JSON.parse(localStorage.getItem(LS_KEY)||”{}”);
var arr=[];
var keys=Object.keys(all);
for(var i=0;i<keys.length;i++){
var obj=all[keys[i]];
obj.date=keys[i];
arr.push(obj);
}
return Promise.resolve(arr);
}catch(e){return Promise.reject(e)}
}

function dbSave(date,data){
if(useLS) return lsSave(date,data);
return idbSave(date,data).catch(function(){useLS=true;return lsSave(date,data)});
}

function dbLoadAll(){
if(useLS) return lsLoadAll();
return idbLoadAll().catch(function(){useLS=true;return lsLoadAll()});
}

// ===== Exercises =====
var EX=[
{id:“calf-raises”,name:“Calf Raises”,em:“🦵”,sets:2,reps:“12-15”,rest:“30s”,
inst:“Stand flat. Rise onto your toes as high as you can. Hold 1 sec at top. Slowly lower.”,

{id:“toe-spreads”,name:“Toe Spreads & Curls”,em:“🦶”,sets:2,reps:“15 / foot”,rest:“20s”,
inst:“Barefoot: spread all toes wide, hold 2 sec. Curl them like gripping the floor, hold 2 sec. That’s 1 rep.”,
tip:“It gets easier fast — that’s the weak muscles waking up.”,prog:“Do them standing on one leg.”,muscles:“Foot muscles”}
];
var TSETS=0;
for(var i=0;i<EX.length;i++) TSETS+=EX[i].sets;

function todayKey(){var d=new Date();return d.getFullYear()+”-”+zp(d.getMonth()+1)+”-”+zp(d.getDate())}
function zp(n){return n<10?“0”+n:””+n}
function fmtDate(s){
var d=new Date(s+“T12:00:00”);
var dn=[“Sun”,“Mon”,“Tue”,“Wed”,“Thu”,“Fri”,“Sat”];
var mn=[“Jan”,“Feb”,“Mar”,“Apr”,“May”,“Jun”,“Jul”,“Aug”,“Sep”,“Oct”,“Nov”,“Dec”];
return dn[d.getDay()]+”, “+mn[d.getMonth()]+” “+d.getDate();
}
function shortDate(s){var d=new Date(s+“T12:00:00”);return(d.getMonth()+1)+”/”+d.getDate()}
function esc(s){return s?s.replace(/&/g,”&”).replace(/</g,”<”).replace(/>/g,”>”).replace(/”/g,”"”):””}

// ===== State =====
var S={
tab:“workout”,
selDate:todayKey(),
curRound:1,
dayData:null,
allDays:[],
expanded:null,
saveStatus:“loading”
};

function freshRound(){return{completed:{},painLevel:-1,notes:””}}
function freshDay(){return{rounds:{“1”:freshRound()}}}
function curRd(){
if(!S.dayData||!S.dayData.rounds) return freshRound();
return S.dayData.rounds[S.curRound]||freshRound();
}
function rdCount(){
if(!S.dayData||!S.dayData.rounds) return 1;
return Object.keys(S.dayData.rounds).length;
}

function loadSelDay(){
var rec=null;
for(var i=0;i<S.allDays.length;i++){
if(S.allDays[i].date===S.selDate){rec=S.allDays[i];break;}
}
if(rec&&rec.rounds){
S.dayData={rounds:rec.rounds};
} else if(rec&&rec.completed){
// migrate old format
S.dayData={rounds:{“1”:{completed:rec.completed,painLevel:rec.painLevel!=null?rec.painLevel:-1,notes:rec.notes||””}}};
} else {
S.dayData=freshDay();
}
if(!S.dayData.rounds[S.curRound]) S.curRound=1;
}

// ===== Init =====
function init(){
dbLoadAll().then(function(all){
S.allDays=all.sort(function(a,b){return a.date>b.date?-1:a.date<b.date?1:0});
loadSelDay();
S.saveStatus=“saved”;
render();
}).catch(function(e){
console.error(“Init failed:”,e);
S.allDays=[];
S.dayData=freshDay();
S.saveStatus=“error”;
render();
});
}

var saveT=null;
function persist(){
S.saveStatus=“saving”;
updStatus();
dbSave(S.selDate,S.dayData).then(function(){
return dbLoadAll();
}).then(function(all){
S.allDays=all.sort(function(a,b){return a.date>b.date?-1:a.date<b.date?1:0});
S.saveStatus=“saved”;
updStatus();
}).catch(function(e){
console.error(“Save error:”,e);
S.saveStatus=“error”;
updStatus();
});
}

function updStatus(){
var el=document.getElementById(“sav”);
if(!el) return;
if(S.saveStatus===“saved”){el.textContent=“✓ Saved”;el.className=“save-ind save-ok”}
else if(S.saveStatus===“saving”){el.textContent=“Saving…”;el.className=“save-ind save-ok”}
else{el.textContent=“⚠ Save failed”;el.className=“save-ind save-err”}
}

// ===== Actions (global) =====
window.A={
tab:function(t){S.tab=t;render()},
expand:function(id){S.expanded=S.expanded===id?null:id;render()},
set:function(exId,si){
var rd=curRd();
var k=exId+”-s”+si;
var c={};var ks=Object.keys(rd.completed);
for(var j=0;j<ks.length;j++) c[ks[j]]=rd.completed[ks[j]];
if(c[k]) delete c[k]; else c[k]=Date.now();
rd.completed=c;
S.dayData.rounds[S.curRound]=rd;
persist();render();
},
pain:function(lv){
var rd=curRd();rd.painLevel=lv;
S.dayData.rounds[S.curRound]=rd;
persist();render();
},
notes:function(el){
var rd=curRd();rd.notes=el.value;
S.dayData.rounds[S.curRound]=rd;
clearTimeout(saveT);saveT=setTimeout(function(){persist()},800);
},
addRound:function(){
var n=rdCount()+1;
S.dayData.rounds[””+n]=freshRound();
S.curRound=n;
persist();render();
},
round:function(r){S.curRound=r;render()},
date:function(el){
S.selDate=el.value;S.curRound=1;
loadSelDay();render();
},
today:function(){
S.selDate=todayKey();S.curRound=1;
loadSelDay();render();
}
};

function isDone(exId,si){return!!curRd().completed[exId+”-s”+si]}
function rdDoneN(){return Object.keys(curRd().completed).length}
function rdPct(){return TSETS?Math.round(rdDoneN()/TSETS*100):0}

function totalSetsDay(rec){
if(!rec) return 0;
if(rec.rounds){var t=0;var ks=Object.keys(rec.rounds);for(var i=0;i<ks.length;i++) t+=Object.keys(rec.rounds[ks[i]].completed||{}).length;return t}
if(rec.completed) return Object.keys(rec.completed).length;
return 0;
}
function totalRoundsDay(rec){
if(rec&&rec.rounds) return Object.keys(rec.rounds).length;
return rec&&rec.completed?1:0;
}
function bestPct(rec){
if(!rec) return 0;
if(rec.rounds){var b=0;var ks=Object.keys(rec.rounds);for(var i=0;i<ks.length;i++){var d=Object.keys(rec.rounds[ks[i]].completed||{}).length;var p=TSETS?Math.round(d/TSETS*100):0;if(p>b)b=p}return b}
if(rec.completed) return TSETS?Math.round(Object.keys(rec.completed).length/TSETS*100):0;
return 0;
}
function avgPain(rec){
if(!rec) return -1;
if(rec.rounds){var s=0,c=0;var ks=Object.keys(rec.rounds);for(var i=0;i<ks.length;i++){var r=rec.rounds[ks[i]];if(r.painLevel!=null&&r.painLevel>=0){s+=r.painLevel;c++}}return c?Math.round(s/c*10)/10:-1}
return rec.painLevel!=null&&rec.painLevel>=0?rec.painLevel:-1;
}

function getStreak(){
var count=0,d=new Date(),tk=todayKey();
for(var x=0;x<365;x++){
var k=d.getFullYear()+”-”+zp(d.getMonth()+1)+”-”+zp(d.getDate());
var rec=null;for(var i=0;i<S.allDays.length;i++){if(S.allDays[i].date===k){rec=S.allDays[i];break}}
var has=rec?totalSetsDay(rec)>0:false;
if(has){count++;d.setDate(d.getDate()-1)}
else if(k===tk){d.setDate(d.getDate()-1)}
else break;
}
return count;
}

function drawChart(cid,data,color){

ctx.scale(dpr,dpr);
var W=rect.width,H=rect.height;

var mx=vals[0],mn=vals[0];
for(var i=1;i<vals.length;i++){if(vals[i]>mx)mx=vals[i];if(vals[i]<mn)mn=vals[i]}
if(mx<1)mx=1;if(mn>0)mn=0;
var rng=mx-mn;if(!rng)rng=1;

```

ctx.strokeStyle="#eee";ctx.lineWidth=.5;
for(var i=0;i<=4;i++){var y=P.t+ch-ch*i/4;ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(W-P.r,y);ctx.stroke()}
ctx.fillStyle="#aaa";ctx.font="10px system-ui,sans-serif";ctx.textAlign="right";
for(var i=0;i<=4;i++){var y=P.t+ch-ch*i/4;ctx.fillText(Math.round(mn+rng*i/4),P.l-5,y+3)}
ctx.textAlign="center";
var step=Math.max(1,Math.floor(data.length/6));

function renderProgress(){

if(!sorted.length) return ‘<div class="empty"><div style="font-size:34px;margin-bottom:10px">📊</div><div>Complete your first workout to see progress.</div></div>’;

var avgP=pDays.length?(pDays.reduce(function(a,b){return a+b},0)/pDays.length).toFixed(1):”—”;

if(pDays.length>=4){
